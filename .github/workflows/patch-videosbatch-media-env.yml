name: patch-videosbatch-media-env

on:
  push:
    branches:
      - feat/native-media-execution

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-media-execution
      - name: Add explicit VideosBatch media mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.env.example')
          text = path.read_text()
          needle = 'VIDEOSBATCH_EXECUTOR_MODE=fake\n'
          replacement = (
              'VIDEOSBATCH_EXECUTOR_MODE=fake\n'
              '# Safe default: fake. Set native only when you intentionally want VideosBatch to reuse SeeReel Seedream/Seedance credentials.\n'
              '# Existing media keys do NOT auto-enable paid VideosBatch image/video generation.\n'
              'VIDEOSBATCH_MEDIA_MODE=fake\n'
          )
          if 'VIDEOSBATCH_MEDIA_MODE=' not in text:
              if needle not in text:
                  raise SystemExit('VIDEOSBATCH_EXECUTOR_MODE marker not found')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
      - name: Commit environment template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example
          git diff --cached --exit-code && exit 0
          git commit -m "docs: expose opt-in native media mode"
          git push origin HEAD:feat/native-media-execution
