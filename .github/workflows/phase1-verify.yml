name: phase1-verify

on:
  push:
    branches:
      - feat/real-provider-text-stages
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Reject superseded VideosBatch workflow vocabulary
        run: npx tsx scripts/smoke-videosbatch-no-legacy-contract.ts
      - name: Verify VideosBatch workflow state when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-workflow-state.ts ]; then
            npx tsx scripts/smoke-videosbatch-workflow-state.ts
          fi
      - name: Verify VideosBatch runner when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-runner.ts ]; then
            npx tsx scripts/smoke-videosbatch-runner.ts
          fi
      - name: Verify VideosBatch API when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-api.ts ]; then
            npx tsx scripts/smoke-videosbatch-api.ts
          fi
      - name: Verify VideosBatch UI when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-ui.ts ]; then
            npx tsx scripts/smoke-videosbatch-ui.ts
          fi
      - name: Verify VideosBatch Phase 1 orchestration E2E when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-e2e.ts ]; then
            npx tsx scripts/smoke-videosbatch-e2e.ts
          fi
      - name: Verify VideosBatch native projection when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-native-projection.ts ]; then
            npx tsx scripts/smoke-videosbatch-native-projection.ts
          fi
      - name: Verify VideosBatch LLM executor contract when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-llm-executor.ts ]; then
            npx tsx scripts/smoke-videosbatch-llm-executor.ts
          fi
      - name: Verify VideosBatch runtime provider readiness
        run: npx tsx scripts/smoke-videosbatch-runtime-provider.ts
      - name: Verify VideosBatch text-stage specs when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-text-stage-specs.ts ]; then
            npx tsx scripts/smoke-videosbatch-text-stage-specs.ts
          fi
      - name: Verify VideosBatch LLM text-stage adapter when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-llm-text-stages.ts ]; then
            npx tsx scripts/smoke-videosbatch-llm-text-stages.ts
          fi
      - name: Verify explicit VideosBatch text executor injection when test exists
        shell: bash
        run: |
          if [ -f scripts/smoke-videosbatch-stage-registry-injection.ts ]; then
            npx tsx scripts/smoke-videosbatch-stage-registry-injection.ts
          fi
      - name: Verify FrameFlow canonical workflow alignment
        run: npx tsx scripts/smoke-videosbatch-frameflow-canonical.ts
      - name: Build upstream SeeReel baseline
        run: npm run build
      - name: Verify Canvas CRUD
        run: npm run smoke:canvas-crud
      - name: Verify shot generation state
        run: npm run smoke:shot-generation-state
      - name: Verify SeeReel skill boundaries
        run: npm run smoke:seereel-skill-boundaries
      - name: Verify stitch pipeline
        run: npm run smoke:libtv-style-stitch
