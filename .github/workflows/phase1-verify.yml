name: phase1-verify

on:
  push:
    branches:
      - feat/phase1-linear-workflow
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Build upstream SeeReel baseline
        run: npm run build
      - name: Verify Canvas CRUD
        run: npm run smoke:canvas-crud
      - name: Verify shot generation state
        run: npm run smoke:shot-generation-state
      - name: Verify SeeReel skill boundaries
        run: npm run smoke:seereel-skill-boundaries
      - name: Verify stitch pipeline
        run: npm run smoke:libtv-style-stitch
