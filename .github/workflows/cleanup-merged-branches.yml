name: cleanup-merged-branches

on:
  push:
    branches:
      - master
    paths:
      - .github/cleanup-merged-branches.request

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Delete superseded merged branches
        run: |
          git push origin --delete \
            design/seereel-chain-workflow \
            feat/seereel-lesson-vertical-slice \
            design/phase1-linear-workflow-v2 \
            feat/phase1-linear-workflow
