name: tmp-install-guided-v2-deps

on:
  push:
    branches:
      - feat/videosbatch-product-ui

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/videosbatch-product-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact V2 dependencies
        run: npm install --save-exact mammoth@1.12.1 pdf-parse@2.4.5 react-dropzone@20.1.1 word-extractor@1.0.4
      - name: Commit dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add Guided Studio V2 dependencies"
          git push origin HEAD:feat/videosbatch-product-ui
