name: wire-videosbatch-api

on:
  push:
    branches:
      - feat/phase1-linear-workflow
    paths:
      - .github/videosbatch-api-wire-request

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase1-linear-workflow
      - name: Inject VideosBatch API registration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/server/index.ts')
          text = path.read_text()

          import_anchor = 'import { CinemaStore } from "./store";\n'
          imports = (
              'import { CinemaStore } from "./store";\n'
              'import { registerVideosBatchWorkflowApi } from "./videosBatchWorkflow/api";\n'
              'import { createVideosBatchStageRegistry } from "./videosBatchWorkflow/stages";\n'
          )
          if 'registerVideosBatchWorkflowApi' not in text:
              if import_anchor not in text:
                  raise SystemExit('CinemaStore import anchor not found')
              text = text.replace(import_anchor, imports, 1)

          route_anchor = 'app.use(ownedResourceGuard);\n'
          registration = (
              'app.use(ownedResourceGuard);\n'
              'registerVideosBatchWorkflowApi(app, store, createVideosBatchStageRegistry());\n'
          )
          if 'registerVideosBatchWorkflowApi(app, store' not in text:
              if route_anchor not in text:
                  raise SystemExit('ownedResourceGuard anchor not found')
              text = text.replace(route_anchor, registration, 1)

          path.write_text(text)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet -- src/server/index.ts; then
            echo "VideosBatch API already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/index.ts
          git commit -m "feat: wire VideosBatch workflow API into SeeReel server"
          git push origin HEAD:feat/phase1-linear-workflow
